# Apartado 2.9b: carga el log de texto del robot-02 en el índice fabrica-logs.
# Cada línea se separa en campos con dissect, y la hora local se pasa a UTC con date.
#
# Uso (desde la carpeta de Logstash): bin/logstash -f ~/cursos/codigo/modulo-02/logstash/09b-log-robot.conf
#
# Una línea del log tiene esta forma:
#   23/09/2026 06:13:22 ROBOT-02 [FAULT] E-260: Sobrecorriente en el eje 3

input {
  file {
    path => "${HOME}/cursos/simulador-planta/datos/logs/robot-02.log"
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "${HOME}/cursos/codigo/modulo-02/logstash/ficheros-leidos.log"
    sincedb_path => "/dev/null"
    # Sin codec json: el log no es JSON. Cada línea llega entera en el campo message.
  }
}

filter {
  # 1. Separamos la línea en campos. Lo que va entre %{ } es el nombre de cada campo;
  #    lo demás (espacios, corchetes, dos puntos) tiene que estar tal cual en la línea.
  dissect {
    mapping => {
      "message" => "%{fecha} %{hora} %{equipo} [%{nivel}] %{codigo}: %{mensaje}"
    }
  }

  # 2. Juntamos la fecha y la hora en un solo campo, para convertirlas juntas.
  mutate {
    add_field => { "fecha_hora" => "%{fecha} %{hora}" }
  }

  # 3. Convertimos la fecha y hora local (sin zona) en una fecha de verdad, en UTC, y la guardamos en ts.
  date {
    match => ["fecha_hora", "dd/MM/yyyy HH:mm:ss"]
    timezone => "Europe/Madrid"
    target => "ts"
  }

  # 4. Ajustes finales:
  #    - el equipo, en minúsculas, como en los demás índices (robot-02, no ROBOT-02);
  #    - la línea completa se guarda en texto, para poder buscar en ella;
  #    - quitamos los campos auxiliares y los que añade Logstash.
  mutate {
    lowercase => ["equipo"]
    rename => { "message" => "texto" }
    remove_field => ["fecha", "hora", "fecha_hora", "@timestamp", "@version", "event", "host", "log"]
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    user => "elastic"
    password => "${ES_CONTRASENA}"
    ssl_certificate_authorities => ["${HOME}/elk/elasticsearch-9.5.5/config/certs/http_ca.crt"]
    index => "fabrica-logs"

    # En el log del robot no hay dos líneas en el mismo segundo: equipo y hora bastan.
    document_id => "%{equipo}_%{ts}"
  }
}
