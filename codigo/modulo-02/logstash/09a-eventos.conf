# Apartado 2.9a: carga los eventos (alarmas, averías, cambios de herramienta) del robot-02
# y de la cnc-01 en el índice fabrica-eventos.
#
# Uso (desde la carpeta de Logstash): bin/logstash -f ~/cursos/codigo/modulo-02/logstash/09a-eventos.conf

input {
  file {
    # Una lista de rutas, entre corchetes y separadas por comas: se leen todas.
    path => [
      "${HOME}/cursos/simulador-planta/datos/L1/robot-02/eventos/*.jsonl",
      "${HOME}/cursos/simulador-planta/datos/L1/cnc-01/eventos/*.jsonl"
    ]
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "${HOME}/cursos/codigo/modulo-02/logstash/ficheros-leidos.log"
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

filter {
  # Igual que en 08-telemetria-cnc.conf: quitamos los campos que añade Logstash.
  mutate {
    remove_field => ["@timestamp", "@version", "event", "host", "log"]
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    user => "elastic"
    password => "${ES_CONTRASENA}"
    ssl_certificate_authorities => ["${HOME}/elk/elasticsearch-9.5.5/config/certs/http_ca.crt"]
    index => "fabrica-eventos"

    # Equipo y hora no bastan: un cambio de herramienta de la CNC genera dos eventos
    # (cambio_herramienta y alarma) en el mismo milisegundo. Con el tipo de evento, sí es único.
    document_id => "%{equipo}_%{ts}_%{tipo_evento}"
  }
}
