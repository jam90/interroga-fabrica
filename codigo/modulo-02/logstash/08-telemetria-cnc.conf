# Apartado 2.8: carga la telemetría de la cnc-01 en el índice fabrica-telemetria,
# junto a la del robot-02 (que se cargó con Python), con documentos iguales a los de Python.
#
# Uso (desde la carpeta de Logstash): bin/logstash -f ~/cursos/codigo/modulo-02/logstash/08-telemetria-cnc.conf

input {
  file {
    # Todos los ficheros de la carpeta: el * vale por cualquier nombre (2026-09-01, 2026-09-02...).
    path => "${HOME}/cursos/simulador-planta/datos/L1/cnc-01/telemetria/*.jsonl"
    mode => "read"

    # Que no borre los ficheros al leerlos: apunta su nombre en ficheros-leidos.log.
    file_completed_action => "log"
    file_completed_log_path => "${HOME}/cursos/codigo/modulo-02/logstash/ficheros-leidos.log"

    # Que no recuerde lo leído: cada vez que lo lances, lee todo desde el principio.
    sincedb_path => "/dev/null"

    codec => "json"
  }
}

filter {
  # Quitamos los campos que añade Logstash por su cuenta, para que los documentos
  # queden iguales que los que cargó Python. @timestamp sería, además, la hora de lectura,
  # no la de la muestra (esa está en ts).
  mutate {
    remove_field => ["@timestamp", "@version", "event", "host", "log"]
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    user => "elastic"
    password => "${ES_CONTRASENA}"
    ssl_certificate_authorities => ["${HOME}/elk/elasticsearch-9.5.5/config/certs/http_ca.crt"]
    index => "fabrica-telemetria"

    # El mismo identificador que en 05-cargar-telemetria.py: equipo y hora.
    # %{campo} se sustituye por el valor de ese campo en cada evento.
    document_id => "%{equipo}_%{ts}"
  }
}
