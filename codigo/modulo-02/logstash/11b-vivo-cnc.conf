# Apartado 2.11b: lee en vivo la telemetría de la cnc-01, según el simulador la va escribiendo,
# y la carga en el índice fabrica-vivo-telemetria (junto al robot-02, que llega por MQTT con Python).
#
# Uso: con 11b-pipelines-vivo.yml (ver la guía), o solo este: bin/logstash -f ~/cursos/codigo/modulo-02/logstash/11b-vivo-cnc.conf

input {
  file {
    # Los ficheros de datos-vivo, no los de datos: uno por día, y el * recoge también los nuevos.
    path => "${HOME}/cursos/simulador-planta/datos-vivo/L1/cnc-01/telemetria/*.jsonl"

    # Modo tail (el que usa Logstash si no se indica otro): lee lo que hay y se queda esperando
    # a que el fichero crezca, como tail -f. Nunca da un fichero por terminado, así que no lo borra.
    mode => "tail"

    # La primera vez que ve un fichero, lo lee desde el principio.
    # Con "end" (el valor por defecto), solo leería las líneas que se escriban a partir de ahora.
    start_position => "beginning"

    # Aquí Logstash apunta hasta dónde ha leído cada fichero. Si lo paras y lo vuelves a lanzar,
    # sigue donde lo dejó: no repite lo leído ni se salta lo que se escribió mientras estaba parado.
    sincedb_path => "${HOME}/cursos/codigo/modulo-02/logstash/sincedb-vivo-cnc"

    codec => "json"
  }
}

filter {
  # Como en 08-telemetria-cnc.conf: quitamos los campos que añade Logstash.
  mutate {
    remove_field => ["@timestamp", "@version", "event", "host", "log"]
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    user => "elastic"
    password => "${ES_CONTRASENA}"
    ssl_certificate_authorities => ["${HOME}/elk/elasticsearch-9.5.5/config/certs/http_ca.crt"]
    index => "fabrica-vivo-telemetria"
    document_id => "%{equipo}_%{ts}"
  }
}
