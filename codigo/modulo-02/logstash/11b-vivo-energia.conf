# Apartado 2.11b: lee en vivo la curva de carga del contador general (un CSV con una línea
# cada cuarto de hora) y la carga en el índice fabrica-vivo-energia.
#
# Uso: con 11b-pipelines-vivo.yml (ver la guía), o solo este: bin/logstash -f ~/cursos/codigo/modulo-02/logstash/11b-vivo-energia.conf
#
# El CSV está «a la española»: separado por punto y coma, con coma decimal y la fecha y la hora
# locales en columnas separadas. Por ejemplo:
#   fecha;hora_inicio;hora_fin;periodo;energia_importada_kwh;energia_exportada_kwh;potencia_media_kw;coste_eur
#   26/10/2026;09:15;09:30;P4;9,742;0,0;38,97;1,2665

input {
  file {
    path => "${HOME}/cursos/simulador-planta/datos-vivo/energia/*.csv"
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "${HOME}/cursos/codigo/modulo-02/logstash/sincedb-vivo-energia"
    # Sin codec json: cada línea llega entera en el campo message.
  }
}

filter {
  # 1. Separamos la línea en columnas, con el filtro csv.
  #    skip_header salta la cabecera: la línea que coincide con los nombres de las columnas.
  csv {
    separator => ";"
    columns => ["fecha", "hora_inicio", "hora_fin", "periodo", "energia_importada_kwh",
                "energia_exportada_kwh", "potencia_media_kw", "coste_eur"]
    skip_header => true
  }

  # 2. Cambiamos la coma decimal por un punto (gsub: buscar y reemplazar)
  #    y convertimos los números, que hasta ahora son textos, en números con decimales.
  #    Tienen que ser dos mutate: dentro de uno solo, Logstash hace convert antes que gsub,
  #    sea cual sea el orden en que se escriban, y no podría convertir "9,742".
  mutate {
    gsub => [
      "energia_importada_kwh", ",", ".",
      "energia_exportada_kwh", ",", ".",
      "potencia_media_kw", ",", ".",
      "coste_eur", ",", "."
    ]
  }
  mutate {
    convert => {
      "energia_importada_kwh" => "float"
      "energia_exportada_kwh" => "float"
      "potencia_media_kw" => "float"
      "coste_eur" => "float"
    }
  }

  # 3. Como en 09b-log-robot.conf: juntamos fecha y hora de inicio y las pasamos a UTC, en ts.
  mutate {
    add_field => { "fecha_hora" => "%{fecha} %{hora_inicio}" }
  }
  date {
    match => ["fecha_hora", "dd/MM/yyyy HH:mm"]
    timezone => "Europe/Madrid"
    target => "ts"
  }

  # 4. Quitamos los campos auxiliares (ya están en ts) y los que añade Logstash.
  mutate {
    remove_field => ["fecha", "hora_inicio", "hora_fin", "fecha_hora", "message",
                     "@timestamp", "@version", "event", "host", "log"]
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    user => "elastic"
    password => "${ES_CONTRASENA}"
    ssl_certificate_authorities => ["${HOME}/elk/elasticsearch-9.5.5/config/certs/http_ca.crt"]
    index => "fabrica-vivo-energia"

    # Una línea por cuarto de hora y un solo contador: la hora de inicio basta.
    document_id => "%{ts}"
  }
}
