# Apartado 2.7: primer pipeline de Logstash.
# Lee los textos del 23 de septiembre, los muestra en pantalla y los envía a Elasticsearch,
# al índice de práctica practica-logstash.
#
# Uso (desde la carpeta de Logstash): bin/logstash -f ~/cursos/codigo/modulo-02/logstash/07-primeros-pasos.conf
#
# ${HOME} es tu carpeta personal: Logstash la sustituye al arrancar.
# ${ES_CONTRASENA} es la contraseña de elastic, guardada en el almacén de claves (keystore) de Logstash.

input {
  file {
    # Fichero que se lee. Tiene que ser una ruta completa: Logstash no entiende ~.
    path => "${HOME}/cursos/simulador-planta/datos/L1/textos/2026-09-23.jsonl"

    # Modo lectura: lee el fichero entero, de principio a fin.
    mode => "read"

    # Por defecto, en modo lectura, Logstash BORRA el fichero cuando termina de leerlo.
    # Con "log", en lugar de borrarlo, apunta su nombre en este otro fichero.
    file_completed_action => "log"
    file_completed_log_path => "${HOME}/cursos/codigo/modulo-02/logstash/ficheros-leidos.log"

    # Logstash recuerda hasta dónde ha leído cada fichero (el sincedb), para no repetir.
    # Con /dev/null no recuerda nada: cada vez que lo lances, leerá el fichero desde el principio.
    sincedb_path => "/dev/null"

    # Cada línea del fichero es un mensaje JSON: el codec json la convierte en campos.
    codec => "json"
  }
}

output {
  # En pantalla, para ver cada evento tal como queda.
  stdout {
    codec => rubydebug
  }

  # Y a Elasticsearch, igual que hacían los scripts de Python.
  elasticsearch {
    hosts => ["https://localhost:9200"]
    user => "elastic"
    password => "${ES_CONTRASENA}"
    ssl_certificate_authorities => ["${HOME}/elk/elasticsearch-9.5.5/config/certs/http_ca.crt"]
    index => "practica-logstash"
  }
}
